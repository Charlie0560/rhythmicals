<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Figtree:wght@400;600;700&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Contact | Rhythmicals Drum Circle</title>
  </head>
  <body>
    <header id="hdr"></header>
    <div class="hero small">
      <div class="wrap">
        <h1>Let’s plan your drum circle.</h1>
        <p class="lead">
          Share a few details and we’ll reply with options and pricing.
        </p>
      </div>
    </div>
    <section>
      <div class="wrap contact">
        <div>
          <h2>Get in touch</h2>
          <ul class="list">
            <li><a class="ico" href="tel:+917745038820"><span data-ic="phone"></span>+91 77450 38820</a></li>
            <li><a class="ico" href="https://wa.me/917745038820" target="_blank" rel="noopener"><span data-ic="wa"></span>Message Nishant on WhatsApp</a></li>
            <li><a class="ico" href="mailto:nishantdandwate000@gmail.com"><span data-ic="mail"></span>nishantdandwate000@gmail.com</a></li>
            <li><a class="ico" href="https://www.instagram.com/rhythmicalsdrumcircle" target="_blank" rel="noopener"><span data-ic="ig"></span>@rhythmicalsdrumcircle</a></li>
            <li><a class="ico" href="https://instagram.com/rhythmic_nish" target="_blank" rel="noopener"><span data-ic="ig"></span>@rhythmic_nish</a></li>
          </ul>
          <p>Based in Pune. Available for events across India.</p>
        </div>
        <form id="enq">
          <label
            >Your name<input name="name" required autocomplete="name" /></label
          ><label
            >Email<input
              name="email"
              type="email"
              required
              autocomplete="email" /></label
          ><label
            >Phone<input
              name="phone"
              type="tel"
              required
              autocomplete="tel" /></label
          ><label
            >Event type<select name="type">
              <option>Corporate event or team building</option>
              <option>Private party</option>
              <option>Family gathering</option>
              <option>Social celebration</option>
            </select></label
          ><label
            >Message<textarea
              name="msg"
              rows="4"
              placeholder="Date, city, number of guests"
            ></textarea></label
          ><input
            class="hp"
            name="_honey"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
          /><button class="btn" style="margin: 0" type="submit">
            Send message
          </button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <footer id="ftr"></footer>
    <script src="script.js"></script>
  </body>
</html>
