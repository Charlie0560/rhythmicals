<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Gallery | Rhythmicals Drum Circle</title>
  </head>
  <body>
    <header id="hdr"></header>
    <div class="hero small">
      <div class="wrap">
        <h1>Moments in rhythm.</h1>
        <p class="lead">
          A look at the energy, connection and joy of our drum circles.
        </p>
      </div>
    </div>

    <!-- PHOTOS -->
    <section>
      <div class="wrap">
        <h2>Photos</h2>
        <p class="sub" style="margin-bottom: 32px">
          Moments from our drum circles, big and small.
        </p>
        <div class="grid">
          <div class="photo" style="aspect-ratio: 722/1279">
            <img
              src="images/gallery-1.jpg"
              alt="Audience playing djembe drums together"
              style="object-position: 50% 50%"
              loading="lazy"
            />
          </div>
          <div class="photo" style="aspect-ratio: 16/9">
            <img
              src="images/gallery-7.jpg"
              alt="Drum circle set-up on a lit garden lawn"
              style="object-position: 50% 55%"
              loading="lazy"
            />
          </div>
          <div class="photo" style="aspect-ratio: 432/440">
            <img
              src="images/gallery-6.jpg"
              alt="Corporate drum circle in a courtyard"
              style="object-position: 50% 50%"
              loading="lazy"
            />
          </div>
          <div class="photo" style="aspect-ratio: 3/4">
            <img
              src="images/gallery-5.jpg"
              alt="Facilitator clapping rhythm into a microphone"
              style="object-position: 50% 30%"
              loading="lazy"
            />
          </div>
          <div class="photo" style="aspect-ratio: 722/1279">
            <img
              src="images/gallery-8.jpg"
              alt="Djembe drums waiting on chairs"
              style="object-position: 50% 50%"
              loading="lazy"
            />
          </div>
          <div class="photo" style="aspect-ratio: 16/9">
            <img
              src="images/private2.jpg"
              alt="Drum circle moment"
              style="object-position: 50% 55%"
              loading="lazy"
            />
          </div>
        </div>
      </div>
    </section>

    <!-- VIDEOS -->
    <section class="vsec">
      <div class="wrap">
        <h2>Videos</h2>
        <p class="sub">Short clips from our sessions. Turn up the rhythm.</p>
        <div class="vgrid">
          <div class="photo" style="aspect-ratio: 9/16">
            <video autoplay muted loop playsinline aria-hidden="true">
              <source src="videos/video 1.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="photo" style="aspect-ratio: 9/16">
            <video autoplay muted loop playsinline aria-hidden="true">
              <source src="videos/video 2.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="photo" style="aspect-ratio: 9/16">
            <video autoplay muted loop playsinline aria-hidden="true">
              <source src="videos/video 3.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="photo" style="aspect-ratio: 9/16">
            <video autoplay muted loop playsinline aria-hidden="true">
              <source src="videos/video 4.mp4" type="video/mp4" />
            </video>
          </div>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="wrap">
        <h2>Ready to feel the beat?</h2>
        <p class="sub" style="margin: 0 auto 20px">
          Tell us about your event and we’ll bring the drums.
        </p>
        <a class="btn" href="contact.html">Book a drum circle</a>
      </div>
    </section>
    <footer id="ftr"></footer>
    <script src="script.js"></script>
  </body>
</html>
